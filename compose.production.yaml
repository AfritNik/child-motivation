services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: family
      POSTGRES_USER: family
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family -d family"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: tools
    environment:
      DATABASE_URL: postgresql://family:${POSTGRES_PASSWORD}@db:5432/family?schema=public
      PRODUCTION_SEED: "true"
      PIN_SASHA: ${PIN_SASHA}
      PIN_PAPA: ${PIN_PAPA}
      PIN_GRANDPA: ${PIN_GRANDPA}
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://family:${POSTGRES_PASSWORD}@db:5432/family?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      LOGIN_THROTTLE_SECRET: ${LOGIN_THROTTLE_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
